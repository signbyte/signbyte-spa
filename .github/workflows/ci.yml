# CI for the signbyte web UI: install from the lockfile, then run the same gate a
# developer runs locally — typecheck, tests, build. The build runs as separate steps
# rather than one script so a red run names which stage failed without opening the
# log. The built bundle is kept as a run artifact so every green run holds the exact
# static files it produced; the bundle a self-hoster deploys is published on a
# GitHub release (release.yml), not here.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc      # single source of truth
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Keep the built bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signbyte-spa-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
